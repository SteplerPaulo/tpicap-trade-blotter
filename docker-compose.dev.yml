services:
  backend:
    image: fusion-trade-api:dev
    build:
      context: ./backend
      dockerfile: Dockerfile.dev

    environment:
      NODE_ENV: development

    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
      - backend_dist:/app/build

    command: >
      sh -c "npm ci --no-audit --no-fund &&
             npm run db:generate &&
             npm run db:deploy &&
             npm run db:seed &&
             npm run dev:docker"

    restart: "no"

  frontend:
    image: fusion-trade-web:dev
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev

    environment:
      NODE_ENV: development
      VITE_API_URL: ""
      VITE_PROXY_TARGET: http://backend:3001
      VITE_USE_POLLING: "true"

    ports: !override
      - "127.0.0.1:5173:5173"

    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

    command: >
      sh -c "npm ci --no-audit --no-fund &&
             npm run dev"

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      start_period: 60s
    restart: "no"

volumes:
  backend_node_modules:
  backend_dist:
  frontend_node_modules:
